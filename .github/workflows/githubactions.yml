name: MagicShop CI/CD

on:
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Appwrite Config
  NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_APPWRITE_ENDPOINT }}
  NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT_ID }}
  NEXT_PUBLIC_APPWRITE_PROJECT_NAME: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT_NAME }}
  NEXT_PUBLIC_APPWRITE_DATABASE_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_DATABASE_ID }}
  NEXT_PUBLIC_APPWRITE_POLAROID_COLLECTION_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_POLAROID_COLLECTION_ID }}
  NEXT_PUBLIC_APPWRITE_SUGAVERSE_COLLECTION_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_SUGAVERSE_COLLECTION_ID }}
  NEXT_PUBLIC_APPWRITE_BTSMEMBERS_COLLECTION_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_BTSMEMBERS_COLLECTION_ID }}
  NEXT_PUBLIC_APPWRITE_LOVENOTES_COLLECTION_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_LOVENOTES_COLLECTION_ID }}
  NEXT_PUBLIC_APPWRITE_TETRISBTS_COLLECTION_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_TETRISBTS_COLLECTION_ID }}
  NEXT_PUBLIC_APPWRITE_BUCKET_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_BUCKET_ID }}
  # Spotify Config
  SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
  SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
  SPOTIFY_ENDPOINT_URL: ${{ secrets.SPOTIFY_ENDPOINT_URL }}
  SPOTIFY_TOKEN_URL: ${{ secrets.SPOTIFY_TOKEN_URL }}
  NEXT_PUBLIC_SPOTIFY_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_SPOTIFY_CLIENT_ID }}
  NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit:serial

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  build:
    needs: [lint, typecheck, test, playwright]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: 'npm'
      - run: npm ci
      - name: Build
        run: npm run build