name: MagicShop CI/CD

on:
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  # Appwrite Config
  NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_APPWRITE_ENDPOINT }}
  NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT_ID }}
  NEXT_PUBLIC_APPWRITE_PROJECT_NAME: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT_NAME }}
  NEXT_PUBLIC_APPWRITE_DATABASE_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_DATABASE_ID }}
  NEXT_PUBLIC_APPWRITE_POLAROID_COLLECTION_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_POLAROID_COLLECTION_ID }}
  NEXT_PUBLIC_APPWRITE_SUGAVERSE_COLLECTION_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_SUGAVERSE_COLLECTION_ID }}
  NEXT_PUBLIC_APPWRITE_BTSMEMBERS_COLLECTION_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_BTSMEMBERS_COLLECTION_ID }}
  NEXT_PUBLIC_APPWRITE_LOVENOTES_COLLECTION_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_LOVENOTES_COLLECTION_ID }}
  NEXT_PUBLIC_APPWRITE_TETRISBTS_COLLECTION_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_TETRISBTS_COLLECTION_ID }}
  NEXT_PUBLIC_APPWRITE_BUCKET_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_BUCKET_ID }}

  # Spotify Config
  SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
  SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
  SPOTIFY_ENDPOINT_URL: ${{ secrets.SPOTIFY_ENDPOINT_URL }}
  SPOTIFY_TOKEN_URL: ${{ secrets.SPOTIFY_TOKEN_URL }}

  # Tu repo no tiene este secret separado, así que lo mapeamos.
  NEXT_PUBLIC_SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}

  # En CI la app corre localmente.
  NEXT_PUBLIC_BASE_URL: http://localhost:3000

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit:serial

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Verify required env vars
        shell: bash
        run: |
          missing=0

          check_env () {
            local name="$1"
            if [ -z "$(printenv "$name")" ]; then
              echo "❌ Missing env var: $name"
              missing=1
            else
              echo "✅ $name is set"
            fi
          }

          check_env NEXT_PUBLIC_APPWRITE_ENDPOINT
          check_env NEXT_PUBLIC_APPWRITE_PROJECT_ID
          check_env NEXT_PUBLIC_APPWRITE_PROJECT_NAME
          check_env NEXT_PUBLIC_APPWRITE_DATABASE_ID
          check_env NEXT_PUBLIC_APPWRITE_POLAROID_COLLECTION_ID
          check_env NEXT_PUBLIC_APPWRITE_SUGAVERSE_COLLECTION_ID
          check_env NEXT_PUBLIC_APPWRITE_BTSMEMBERS_COLLECTION_ID
          check_env NEXT_PUBLIC_APPWRITE_LOVENOTES_COLLECTION_ID
          check_env NEXT_PUBLIC_APPWRITE_TETRISBTS_COLLECTION_ID
          check_env NEXT_PUBLIC_APPWRITE_BUCKET_ID

          check_env SPOTIFY_CLIENT_ID
          check_env SPOTIFY_CLIENT_SECRET
          check_env SPOTIFY_ENDPOINT_URL
          check_env SPOTIFY_TOKEN_URL

          check_env NEXT_PUBLIC_BASE_URL

          if [ "$missing" -eq 1 ]; then
            echo "Some required env vars are missing."
            exit 1
          fi

      - name: Debug Appwrite collections
        shell: bash
        run: |
          node <<'NODE'
          const endpoint = process.env.NEXT_PUBLIC_APPWRITE_ENDPOINT?.replace(/\/$/, "");
          const projectId = process.env.NEXT_PUBLIC_APPWRITE_PROJECT_ID;
          const databaseId = process.env.NEXT_PUBLIC_APPWRITE_DATABASE_ID;

          const collections = {
            LOVENOTES: process.env.NEXT_PUBLIC_APPWRITE_LOVENOTES_COLLECTION_ID,
            BTSMEMBERS: process.env.NEXT_PUBLIC_APPWRITE_BTSMEMBERS_COLLECTION_ID,
            POLAROID: process.env.NEXT_PUBLIC_APPWRITE_POLAROID_COLLECTION_ID,
            SUGAVERSE: process.env.NEXT_PUBLIC_APPWRITE_SUGAVERSE_COLLECTION_ID,
            TETRISBTS: process.env.NEXT_PUBLIC_APPWRITE_TETRISBTS_COLLECTION_ID,
          };

          console.log("Endpoint set:", Boolean(endpoint));
          console.log("Project ID set:", Boolean(projectId));
          console.log("Database ID set:", Boolean(databaseId));

          async function checkCollection(name, collectionId) {
            if (!collectionId) {
              console.log(`❌ ${name}: missing collection id`);
              process.exitCode = 1;
              return;
            }

            const url = `${endpoint}/databases/${databaseId}/collections/${collectionId}/documents`;

            try {
              const res = await fetch(url, {
                headers: {
                  "X-Appwrite-Project": projectId,
                },
              });

              const text = await res.text();

              let body;
              try {
                body = JSON.parse(text);
              } catch {
                body = null;
              }

              console.log(`\n--- ${name} ---`);
              console.log("Status:", res.status);

              if (!res.ok) {
                console.log("Body:", text.slice(0, 700));
                process.exitCode = 1;
                return;
              }

              console.log("Total:", body?.total);
              console.log("Documents length:", body?.documents?.length);

              if (body?.documents?.[0]) {
                console.log("First document keys:", Object.keys(body.documents[0]));
              }
            } catch (error) {
              console.log(`❌ ${name}: request failed`);
              console.log(error);
              process.exitCode = 1;
            }
          }

          for (const [name, collectionId] of Object.entries(collections)) {
            await checkCollection(name, collectionId);
          }
          NODE

      - name: Debug env hashes
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require("crypto");

          const keys = [
            "NEXT_PUBLIC_APPWRITE_ENDPOINT",
            "NEXT_PUBLIC_APPWRITE_PROJECT_ID",
            "NEXT_PUBLIC_APPWRITE_DATABASE_ID",
            "NEXT_PUBLIC_APPWRITE_LOVENOTES_COLLECTION_ID",
            "NEXT_PUBLIC_APPWRITE_BTSMEMBERS_COLLECTION_ID",
            "NEXT_PUBLIC_APPWRITE_POLAROID_COLLECTION_ID",
            "NEXT_PUBLIC_APPWRITE_SUGAVERSE_COLLECTION_ID",
            "NEXT_PUBLIC_APPWRITE_TETRISBTS_COLLECTION_ID",
          ];

          for (const key of keys) {
            const value = process.env[key] || "";
            const hash = crypto.createHash("sha256").update(value).digest("hex").slice(0, 12);
            console.log(`${key}: ${hash}`);
          }
          NODE

      - name: Run Playwright tests
        run: npx playwright test
        env:
          # Pasar explícitamente TODAS las env vars al proceso de Playwright
          # para que estén disponibles durante npm run build && npm run start
          NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_APPWRITE_ENDPOINT }}
          NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT_ID }}
          NEXT_PUBLIC_APPWRITE_PROJECT_NAME: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT_NAME }}
          NEXT_PUBLIC_APPWRITE_DATABASE_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_DATABASE_ID }}
          NEXT_PUBLIC_APPWRITE_POLAROID_COLLECTION_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_POLAROID_COLLECTION_ID }}
          NEXT_PUBLIC_APPWRITE_SUGAVERSE_COLLECTION_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_SUGAVERSE_COLLECTION_ID }}
          NEXT_PUBLIC_APPWRITE_BTSMEMBERS_COLLECTION_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_BTSMEMBERS_COLLECTION_ID }}
          NEXT_PUBLIC_APPWRITE_LOVENOTES_COLLECTION_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_LOVENOTES_COLLECTION_ID }}
          NEXT_PUBLIC_APPWRITE_TETRISBTS_COLLECTION_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_TETRISBTS_COLLECTION_ID }}
          NEXT_PUBLIC_APPWRITE_BUCKET_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_BUCKET_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_ENDPOINT_URL: ${{ secrets.SPOTIFY_ENDPOINT_URL }}
          SPOTIFY_TOKEN_URL: ${{ secrets.SPOTIFY_TOKEN_URL }}
          NEXT_PUBLIC_SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          NEXT_PUBLIC_BASE_URL: http://localhost:3000

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  build:
    needs: [ lint, typecheck, test, playwright ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # También para el build final
          NEXT_PUBLIC_APPWRITE_ENDPOINT: ${{ secrets.NEXT_PUBLIC_APPWRITE_ENDPOINT }}
          NEXT_PUBLIC_APPWRITE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT_ID }}
          NEXT_PUBLIC_APPWRITE_PROJECT_NAME: ${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT_NAME }}
          NEXT_PUBLIC_APPWRITE_DATABASE_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_DATABASE_ID }}
          NEXT_PUBLIC_APPWRITE_POLAROID_COLLECTION_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_POLAROID_COLLECTION_ID }}
          NEXT_PUBLIC_APPWRITE_SUGAVERSE_COLLECTION_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_SUGAVERSE_COLLECTION_ID }}
          NEXT_PUBLIC_APPWRITE_BTSMEMBERS_COLLECTION_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_BTSMEMBERS_COLLECTION_ID }}
          NEXT_PUBLIC_APPWRITE_LOVENOTES_COLLECTION_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_LOVENOTES_COLLECTION_ID }}
          NEXT_PUBLIC_APPWRITE_TETRISBTS_COLLECTION_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_TETRISBTS_COLLECTION_ID }}
          NEXT_PUBLIC_APPWRITE_BUCKET_ID: ${{ secrets.NEXT_PUBLIC_APPWRITE_BUCKET_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_ENDPOINT_URL: ${{ secrets.SPOTIFY_ENDPOINT_URL }}
          SPOTIFY_TOKEN_URL: ${{ secrets.SPOTIFY_TOKEN_URL }}
          NEXT_PUBLIC_SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
